name: Kick Bot

on:
  workflow_dispatch:
    inputs:
      stream:
        description: 'URL del stream'
        required: true
        default: 'https://kick.com/canal'
      viewers:
        description: 'Cantidad de viewers'
        required: true
        default: '50'
      duration:
        description: 'Minutos (max 360)'
        required: true
        default: '60'

env:
  STREAM_URL: ${{ github.event.inputs.stream }}
  VIEWERS: ${{ github.event.inputs.viewers }}
  DURATION: ${{ github.event.inputs.duration }}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 370

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Instalar dependencias
        run: |
          pip install curl-cffi
          npm install ws

      - name: Ejecutar bot
        run: |
          timeout $((DURATION * 60)) node kick-websocket-BACKUP.js "$STREAM_URL" "$VIEWERS" || true
